<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sitara Application Hub — Texas Instruments</title>
  <link rel="icon" href="assets/img/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div id="app">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header>
    <img src="assets/img/ti_logo.png" alt="Texas Instruments" class="header-logo" />
    <div class="header-divider"></div>
    <div class="header-title">Sitara <span>Application Hub</span></div>
    <div class="header-spacer"></div>
    <div class="search-wrap">
      <!-- search icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        v-model="searchQuery"
        type="search"
        class="search-input"
        placeholder="Search applications…"
        aria-label="Search applications"
      />
    </div>
  </header>

  <!-- ── Body layout ──────────────────────────────────────── -->
  <div class="layout">

    <!-- ── Sidebar ────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">Filters</div>

      <template v-for="group in FILTER_GROUPS" :key="group.key">
        <div class="filter-group">
          <button
            class="filter-group-header"
            :class="{ open: openGroups[group.key] }"
            @click="toggleGroup(group.key)"
            :aria-expanded="openGroups[group.key]"
          >
            {{ group.label }}
            <!-- chevron icon -->
            <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="filter-group-body" :class="{ open: openGroups[group.key] }">
            <label
              v-for="option in group.options"
              :key="option"
              class="filter-option"
            >
              <input
                type="checkbox"
                :checked="isChecked(group.key, option)"
                @change="toggleFilter(group.key, option)"
              />
              {{ option }}
              <span class="filter-count">{{ countFor(group.key, option) }}</span>
            </label>
          </div>
        </div>
      </template>

      <button v-if="hasAnyFilter" class="clear-all-btn" @click="clearAll">
        Clear all filters
      </button>
    </aside>

    <!-- ── Main ───────────────────────────────────────────── -->
    <main class="main">

      <!-- Toolbar: count + active filter chips -->
      <div class="toolbar">
        <span class="result-count">
          Total: <strong>{{ filteredApps.length }}</strong>
          <template v-if="allApps.length !== filteredApps.length">
            / {{ allApps.length }}
          </template>
        </span>
        <div class="active-filters">
          <span v-for="chip in activeChips" :key="chip.key + chip.value" class="filter-chip">
            {{ chip.label }}
            <button @click="removeChip(chip.key, chip.value)" :aria-label="'Remove filter ' + chip.label">×</button>
          </span>
        </div>
      </div>

      <!-- Application cards -->
      <div class="cards-grid">

        <template v-if="filteredApps.length > 0">
          <article v-for="app in filteredApps" :key="app.id" class="app-card">

            <div class="card-title">
              {{ app.title }}
            </div>

            <p class="card-desc">{{ app.description }}</p>

            <div class="card-tags">
              <span v-if="app.recently_added" class="tag tag-new">New</span>
              <span v-for="d in app.device_families" :key="d" class="tag tag-device">{{ d }}</span>
              <span v-for="o in app.os" :key="o" class="tag tag-os">{{ o }}</span>
              <span v-for="c in app.categories" :key="c" class="tag tag-category">{{ c }}</span>
            </div>

            <div class="card-footer">
              <a :href="app.github_url" target="_blank" rel="noopener" class="btn-github">
                <!-- github icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                     fill="currentColor">
                  <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111
                    .793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756
                    -1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237
                    1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305
                    -5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524
                    .117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005
                    2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118
                    3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823
                    1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0
                    -6.627-5.373-12-12-12z"/>
                </svg>
                Visit on GitHub
              </a>
              <button
                class="btn-copy"
                :class="{ copied: copiedId === app.id }"
                @click="copyLink(app)"
                :title="copiedId === app.id ? 'Copied!' : 'Copy GitHub link'"
                :aria-label="copiedId === app.id ? 'Copied!' : 'Copy GitHub link'"
              >
                <!-- copy / check icon -->
                <svg v-if="copiedId !== app.id" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                </svg>
                <svg v-else xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </button>
            </div>

          </article>
        </template>

        <!-- Empty state -->
        <div v-else class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <p>No applications match your filters.</p>
        </div>

      </div>
    </main>
  </div><!-- /.layout -->

  <!-- ── Footer ──────────────────────────────────────────── -->
  <footer>
    <span>&copy; 2024 Texas Instruments Incorporated.</span>
    <span class="footer-sep">|</span>
    <a href="https://www.ti.com/corp/docs/legal/privacy.shtml" target="_blank" rel="noopener">Privacy Policy</a>
    <span class="footer-sep">|</span>
    <a href="https://www.ti.com/corp/docs/legal/termsofuse.shtml" target="_blank" rel="noopener">Terms of Use</a>
    <span class="footer-sep">|</span>
    <a href="https://www.ti.com/corp/docs/legal/copyright.shtml" target="_blank" rel="noopener">Copyright</a>
    <span class="footer-right">Sitara Processors &amp; Microprocessors</span>
  </footer>

</div><!-- /#app -->

<!-- Vue.js 3 CDN (production build) -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
